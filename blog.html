<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>blog</title>
</head>
<body> 
  <nav>
    <a href="index.html"> back to homepage</a>
  </nav>
  <section id="blog">
    <h2>Blog</h2>
    <ul id="blog-feed"></ul>
  </section>
  <script>
    (function() {
      const realFetch = window.fetch;
      window.fetch = function(resource, init) {
        if (typeof resource === 'string'
            && resource.match(/(^|\/)json\/blogTest\d+\.json$/)
        ) {
          resource = resource.replace(
            /(^|\/)json\/(blogTest\d+\.json)$/,
            './json/blogs/test/$2'
          );
        }
        return realFetch.call(this, resource, init);
      };
    })();
  </script>
  <script src="./scripts/postSys.js"></script>
  <script src="./scripts/blog.js"></script>
</body>
</html>
